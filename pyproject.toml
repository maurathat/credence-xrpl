[project]
name = "credence"
version = "0.0.0"
description = "Credence (a Kessai product): purpose-bound inference credit for AI agents on the XRPL Lending Protocol."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143.0",
    "pydantic>=2.14.0",
    "pynacl>=1.6.2",
    "rfc8785==0.1.4",
    "uvicorn>=0.54.0",
    "xrpl-py>=5.2.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["credence"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["third_party", "web", "ledger-bridge"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Line length is enforced by `ruff format`; docstrings quote the build plan verbatim.
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["credence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a running local rippled or Speculos (make ledger-up)",
]
